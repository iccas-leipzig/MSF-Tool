<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keine Daten - {{ trainee.first_name }} {{ trainee.last_name }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #555;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ccc;
        }
        p {
            line-height: 1.6;
            margin-bottom: 30px;
            color: #666;
        }
        .close-btn {
            background-color: #2196F3; /* Blue to match Admin theme */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .close-btn:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>

    <div class="container">       
        <h1>Keine Daten vorhanden</h1>
        
        <p>
            Es konnten keine abgegebenen Bewertungen für <br>
            <strong>{{ trainee.first_name }} {{ trainee.last_name }}</strong><br>
            im <strong>{{ months }}-Monate</strong> Intervall gefunden werden.
        </p>       

        <button onclick="window.close()" class="close-btn">Schließen</button>
    </div>

</body>
</html>
