<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f6f8; }
        .box { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #dc3545; }
        h1 { color: #dc3545; margin-top: 0; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="box">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        
        <h1>Hoppla! Da ist etwas schiefgelaufen.</h1>
        
        <p style="font-size: 16px; color: #333;"><strong>{{ message }}</strong></p>
    </div>
</body>
</html>
