name: CI

on:
  push:
    branches: [main, dev]
    # Semantic version tags, optionally v-prefixed and/or pre-release
    # (e.g. 1.0.0, v1.0.0, v0.1.0-alpha, v1.0.0-rc.1)
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
      - 'v?[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:

# Least privilege by default; the publish job widens this for itself only
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/multi_source_feedback

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MSF_Tool
    env:
      # settings.py requires EMAIL_PORT; the tests use Django's in-memory mail backend
      EMAIL_PORT: '25'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: MSF_Tool/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  # Builds the image and pushes it to the GitHub Container Registry:
  #   main  -> latest
  #   dev   -> dev
  #   vX.Y.Z / X.Y.Z   -> X.Y.Z and latest
  #   vX.Y.Z-pre       -> X.Y.Z-pre only (pre-releases never move latest)
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: MSF_Tool
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
